name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject unpublished leak strings
        run: |
          set -euo pipefail
          if find docs -name '*.png' -print -quit | grep -q .; then
            echo 'unpublished figure PNG under docs/' >&2
            exit 1
          fi
          if grep -R -E -i 'unpublished results|AUROC|0\.946|1,191|\b1191\b|SOTA|overconfident|0\.110|r=−0\.963' docs --include='*.html'; then
            echo 'unpublished leak strings in docs/' >&2
            exit 1
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
